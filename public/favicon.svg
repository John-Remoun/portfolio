<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;display=swap');
      .jr-text {
        font-family: 'Cormorant Garamond', 'Cinzel', 'Playfair Display', 'Georgia', serif;
        font-weight: 700;
        font-size: 260px;
        fill: url(#goldGrad);
        letter-spacing: 4px;
      }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e5ab"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#997b2c"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c9a84c" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g filter="url(#goldGlow)">
    <!-- Top thin gold arc and dot emblem from top navbar design -->
    <path d="M 120 185 A 165 165 0 0 1 392 185" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" opacity="0.65"/>
    <circle cx="256" cy="82" r="15" fill="url(#goldGrad)"/>
    
    <!-- Transparent Background Gold Serif JR -->
    <text x="256" y="372" text-anchor="middle" class="jr-text">JR</text>
  </g>
</svg>
